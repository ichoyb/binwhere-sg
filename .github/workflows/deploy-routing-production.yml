name: Deploy Walking Routes to Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routing-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify walking graph
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      release_id: ${{ steps.bundle.outputs.release_id }}
      archive_sha256: ${{ steps.bundle.outputs.archive_sha256 }}
      script_sha256: ${{ steps.bundle.outputs.script_sha256 }}
      artifact_name: ${{ steps.bundle.outputs.artifact_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Lint routing workflow with pinned actionlint
        run: python3 ops/routing/lint-workflow.py "${RUNNER_TEMP}/routing-tools"

      - name: Build pinned Ubuntu tools
        run: |
          test "$(uname -m)" = x86_64
          docker build --platform linux/amd64 \
            --build-arg "BUILD_LABEL=github-routing-${GITHUB_RUN_ID}" \
            -t binwhere-routing-build:26.11.0 \
            -f ops/routing/Dockerfile.build ops/routing

      - name: Build engine, graph, quality gate and immutable package
        run: |
          mkdir -p "${RUNNER_TEMP}/routing"
          docker run --rm --platform linux/amd64 \
            --label "binwhere-run=github-routing-${GITHUB_RUN_ID}" \
            --memory 6g -e BUILD_JOBS="$(nproc)" \
            -v "${GITHUB_WORKSPACE}:/repo:ro" \
            -v "${RUNNER_TEMP}/routing:/work" \
            binwhere-routing-build:26.11.0 \
            bash /repo/ops/routing/build-release.sh /work /work/output

      - name: Create transfer metadata
        id: bundle
        run: |
          bundle="${RUNNER_TEMP}/routing-transfer"
          mkdir -p "${bundle}"
          cp -R "${RUNNER_TEMP}/routing/output/." "${bundle}/"
          cp ops/deploy-routing-release.sh "${bundle}/deploy-routing-release.sh"
          release_id="$(jq -r .release_id "${bundle}/release.json")"
          archive_sha256="$(jq -r .archive_sha256 "${bundle}/release.json")"
          script_sha256="$(sha256sum "${bundle}/deploy-routing-release.sh" | awk '{print $1}')"
          {
            echo "release_id=${release_id}"
            echo "archive_sha256=${archive_sha256}"
            echo "script_sha256=${script_sha256}"
            echo "artifact_name=routing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >>"${GITHUB_OUTPUT}"

      - name: Transfer verified release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: ${{ runner.temp }}/routing-transfer
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    name: Deploy routes through SSM
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/routing

      - name: Verify transferred files
        env:
          ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
          SCRIPT_SHA256: ${{ needs.build.outputs.script_sha256 }}
        run: |
          bundle="${RUNNER_TEMP}/routing"
          test "$(sha256sum "${bundle}/binwhere-routing.tar.gz" | awk '{print $1}')" = "${ARCHIVE_SHA256}"
          test "$(sha256sum "${bundle}/deploy-routing-release.sh" | awk '{print $1}')" = "${SCRIPT_SHA256}"

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: binwhere-routing-${{ github.run_id }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Upload immutable routing artifact
        env:
          ARTIFACT_BUCKET: ${{ vars.WEB_ARTIFACT_BUCKET }}
          RELEASE_ID: ${{ needs.build.outputs.release_id }}
        run: |
          [[ "${ARTIFACT_BUCKET}" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          [[ "${RELEASE_ID}" =~ ^[0-9a-f]{64}$ ]]
          prefix="s3://${ARTIFACT_BUCKET}/releases/routing/${RELEASE_ID}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws s3 cp "${RUNNER_TEMP}/routing/binwhere-routing.tar.gz" \
            "${prefix}/binwhere-routing.tar.gz" --sse AES256 --only-show-errors
          aws s3 cp "${RUNNER_TEMP}/routing/deploy-routing-release.sh" \
            "${prefix}/deploy-routing-release.sh" --sse AES256 --only-show-errors

      - name: Run host deployment through SSM
        env:
          ARTIFACT_BUCKET: ${{ vars.WEB_ARTIFACT_BUCKET }}
          INSTANCE_ID: ${{ vars.WEB_INSTANCE_ID }}
          RELEASE_ID: ${{ needs.build.outputs.release_id }}
          ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
          SCRIPT_SHA256: ${{ needs.build.outputs.script_sha256 }}
        run: |
          [[ "${INSTANCE_ID}" =~ ^i-[0-9a-f]+$ ]]
          prefix="s3://${ARTIFACT_BUCKET}/releases/routing/${RELEASE_ID}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_dir="/var/tmp/binwhere-routing-command-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_script="${remote_dir}/deploy-routing-release.sh"
          remote_archive="${remote_dir}/binwhere-routing.tar.gz"
          remote_command="set -eu; trap 'rm -rf -- ${remote_dir}' EXIT; install -d -m 0700 ${remote_dir}; aws s3 cp ${prefix}/deploy-routing-release.sh ${remote_script} --only-show-errors; aws s3 cp ${prefix}/binwhere-routing.tar.gz ${remote_archive} --only-show-errors; printf '%s  %s\\n' ${SCRIPT_SHA256} ${remote_script} | sha256sum -c -; chmod 0700 ${remote_script}; ${remote_script} ${remote_archive} ${ARCHIVE_SHA256} ${RELEASE_ID} x86_64"
          jq -n --arg command "${remote_command}" \
            '{commands: [$command], executionTimeout: ["900"]}' >"${RUNNER_TEMP}/ssm-routing.json"
          command_id="$(aws ssm send-command --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript --comment "BinWhere routing ${RELEASE_ID}" \
            --parameters "file://${RUNNER_TEMP}/ssm-routing.json" \
            --query 'Command.CommandId' --output text)"
          status=Pending
          for _ in {1..180}; do
            status="$(aws ssm get-command-invocation --command-id "${command_id}" \
              --instance-id "${INSTANCE_ID}" --query Status --output text 2>/dev/null || true)"
            case "${status}" in
              Success | Cancelled | TimedOut | Failed | Cancelling) break ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "${command_id}" --instance-id "${INSTANCE_ID}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output json
          test "${status}" = Success
