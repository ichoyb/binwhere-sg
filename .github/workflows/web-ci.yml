name: Web CI

on:
  pull_request:
  push:
    branches:
      - master
    # None of the checks read these paths.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            packages/core/package-lock.json

      - name: Install core locked dependencies
        working-directory: packages/core
        run: npm ci

      - name: Audit core dependencies
        working-directory: packages/core
        run: npm audit --omit=dev --audit-level=high

      - name: Install Web locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Audit build dependencies
        run: npm run audit:build

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Type-check
        run: npm exec tsc -- --noEmit

      - name: Run unit and contract tests
        run: npm run test:unit

      - name: Verify Web-only deployment tree
        run: npm run package:web
